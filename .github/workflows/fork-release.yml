# Explicit reviewed tag dispatch -> GHCR with SBOM + provenance.
name: fork-release

on:
  # Only the reviewed tag dispatcher or an explicitly approved manual retry.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require an explicit version tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == tag ]]
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-cav\.[1-9][0-9]*$ ]]
      - name: Derive image name from the repository owner
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$REF_NAME" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$REF_NAME already exists; GHCR tags are mutable, so never republish one"
            exit 1
          fi
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # vX.Y.Z-cav.N is the only format Renovate parses (homelab renovate.json5).
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
